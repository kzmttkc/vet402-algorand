# Delivery board sweep on Algorand MainNet (scripts/board-sweep.ts).
# Buys with the payer wallet in secrets; commits only board/*.json.
# Secrets live in the GitHub environment "mainnet-board" (restrict it to the main branch):
#   BOARD_PAYER_MNEMONIC  required on MainNet: a wallet used only by the board
#                         (the script refuses the /v1/check payer wallet)
#   (the /v1/check payer key is NOT given to this workflow; its public address is a constant in the script)
name: board

on:
  schedule:
    # Three chances a day, early in the UTC day (the cap's day). A scheduled run can start hours late
    # (2026-09-27: 21:00 UTC ran at 23:29) or not at all (2026-09-28 21:00 UTC never ran). The first
    # run that finishes the daily writes completedAt in board/<UTC date>.json; the later ones that day
    # find it and buy nothing (scripts/board-sweep.ts). 18:17 + 5 h is still the same UTC day.
    - cron: "17 6 * * *"
    - cron: "17 12 * * *"
    - cron: "17 18 * * *"
    # One-off census rerun with the corrected verdict code: 2026-09-28 00:30 UTC = 09:30 JST.
    # cron has no year, so the Sweep step runs it only in 2026 (every other year it does nothing).
    - cron: "30 0 28 9 *"
  workflow_dispatch:
    inputs:
      mode:
        description: daily (one per seller) or census (every listed resource)
        type: choice
        options: [daily, census]
        default: daily
      dry_run:
        description: list targets and the cost estimate only (no payment, no commit)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: board
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    environment: mainnet-board
    permissions:
      contents: write
    timeout-minutes: 240
    env:
      X402_NETWORK: mainnet
      I_UNDERSTAND_MAINNET_MOVES_REAL_FUNDS: "yes"
      # A scheduled run has no inputs: the 09-28 schedule is the census, the daily schedule is daily.
      MODE: ${{ inputs.mode || (github.event.schedule == '30 0 28 9 *' && 'census') || 'daily' }}
      DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
      BOARD_MAX_PER_DAY_USDC: ${{ (inputs.mode == 'census' || github.event.schedule == '30 0 28 9 *') && '60' || '3' }}
      CENSUS_ONE_OFF: ${{ github.event.schedule == '30 0 28 9 *' && 'true' || 'false' }}
    steps:
      # The branch tip when this job starts, not the commit the schedule fired on: a run that waited
      # behind another one (concurrency: board) must see the board file that run pushed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Record the run date (UTC)
        run: echo "BOARD_DATE=$(date -u +%F)" >> "$GITHUB_ENV"
      - name: Sweep
        env:
          BOARD_PAYER_MNEMONIC: ${{ secrets.BOARD_PAYER_MNEMONIC }}
        run: |
          if [ "$CENSUS_ONE_OFF" = "true" ] && [ "$(date -u +%Y)" != "2026" ]; then
            echo "the one-off census schedule is for 2026 only; nothing to do"; exit 0
          fi
          args=()
          if [ "$MODE" = "census" ]; then args+=(--census); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          # Exit code 3: the payment check found a payment on no row, or could not read the chain.
          # The files are written; they are committed below, and the last step fails the job.
          rc=0
          npx tsx scripts/board-sweep.ts "${args[@]}" || rc=$?
          if [ "$rc" -eq 3 ]; then echo "PAYMENT_CHECK_FAILED=true" >> "$GITHUB_ENV"; exit 0; fi
          exit "$rc"
      # Runs even when the sweep failed: the script writes each row as it goes,
      # so a partial day is kept and the next run resumes (never buys a URL twice a day).
      # board/*.json includes spend-mainnet.json (the board's ledger for the day), read by the next run.
      - name: Commit board/*.json
        if: always() && env.DRY_RUN != 'true'
        run: |
          shopt -s nullglob
          files=(board/*.json)
          if [ ${#files[@]} -eq 0 ]; then echo "no board files"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          if git diff --cached --quiet; then echo "no board changes"; exit 0; fi
          git commit -m "board: ${BOARD_DATE} ${MODE}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Fail when a payment is on no row, or the payment check could not run
        if: always() && env.PAYMENT_CHECK_FAILED == 'true'
        run: |
          echo "::error::payment check: see the Sweep log and reconcile in board/*.json"
          exit 1
